name: Weekly models refresh

on:
  schedule:
    # Каждую неделю в понедельник в 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: {}  # ручной запуск

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate category README files
        run: python3 generate.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Коммитим только сгенерированные markdown-файлы категорий
          git add README.text.md README.image.md README.embeddings.md \
                  README.video.md README.audio.md README.rerank.md \
                  README.speech.md README.transcription.md
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "chore: refresh OpenRouter models by category (weekly)"
            git push
          fi